name: Build MM SKY APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android structure
        run: |
          mkdir -p /tmp/temp_project
          cd /tmp/temp_project
          flutter create --org com.example --project-name mm_sky .
          cp -r android/. $GITHUB_WORKSPACE/android/
          cp -r ios $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp -r web $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp -r linux $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp -r macos $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp -r windows $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp .gitignore $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp .metadata $GITHUB_WORKSPACE/ 2>/dev/null || true
          cp analysis_options.yaml $GITHUB_WORKSPACE/ 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mm-sky-apk
          path: build/app/outputs/flutter-apk/app-release.apk
